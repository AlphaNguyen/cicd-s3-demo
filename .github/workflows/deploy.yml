
name: Deploy website len S3

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Lay code tu repository
        uses: actions/checkout@v4

      
      - name: Kiem tra file index.html
        run: |
          test -f site/index.html
          if grep -q "TEN_CUA_BAN" site/index.html; then
            echo "CANH BAO: Chua thay ten!"
            exit 1
          fi
          if grep -q "MA_SINH_VIEN" site/index.html; then
            echo "CANH BAO: Chua thay ma sinh vien!"
            exit 1
          fi
          echo "OK: Da dien thong tin ca nhan"
      - name: Cau hinh AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy len S3
        run: aws s3 sync site/ s3://cicd-web-nguyenhoanganhkhoa-2025/ --delete
